server:
  port: 8082

spring:
  application:
    name: user-management-service
  datasource:
    url: jdbc:postgresql://localhost:5432/whocloud
    username: whocloud_user
    password: whocloud_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info
