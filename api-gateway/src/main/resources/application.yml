server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**
        - id: user-management-service
          uri: http://${USER_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/users/**
        - id: information-service-a
          uri: http://${INFO_A_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/information/a/**
        - id: information-service-b
          uri: http://${INFO_B_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/information/b/**
        - id: business-service-1
          uri: http://${BUSINESS_1_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/business/service1/**
        - id: business-service-2
          uri: http://${BUSINESS_2_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/api/business/service2/**
        - id: business-service-3
          uri: http://${BUSINESS_3_SERVICE_HOST:localhost}:8087
          predicates:
            - Path=/api/business/service3/**
        - id: admin-portal-service
          uri: http://${ADMIN_SERVICE_HOST:localhost}:8088
          predicates:
            - Path=/api/admin/**
        - id: public-web-service
          uri: http://${PUBLIC_SERVICE_HOST:localhost}:8089
          predicates:
            - Path=/api/public/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
