<!DOCTYPE html>
<html>
<head>
    <title>Login - WHO Cloud</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { 
            background: white; 
            padding: 50px 40px; 
            border-radius: 16px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            max-width: 450px; 
            width: 100%;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 { 
            color: #667eea; 
            margin-bottom: 15px;
            font-size: 28px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #666; 
            margin-bottom: 15px; 
            font-size: 16px;
            line-height: 1.5;
        }
        
        .description {
            color: #888;
            font-size: 14px;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        
        .login-btn { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: #444; 
            padding: 14px 32px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            transition: all 0.3s ease;
            border: 2px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .login-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border-color: #4285f4;
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .google-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }
        
        .footer {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        
        .footer-text {
            color: #999;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .role-badge {
            display: inline-block;
            background: #ffeaa7;
            color: #d63031;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }
        
        .features {
            text-align: left;
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 14px;
            color: #555;
        }
        
        .feature-icon {
            margin-right: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔐</div>
        <h1>WHO Cloud Platform</h1>
        <p class="subtitle">Microservices Architecture</p>
        <p class="description">Secure authentication powered by OAuth 2.0</p>
        
        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">✓</span>
                <span>JWT Token Authentication</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">✓</span>
                <span>Role-Based Access Control</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">✓</span>
                <span>12 Microservices Architecture</span>
            </div>
        </div>
        
        <a href="/login/oauth2/authorization/google" class="login-btn">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
        </a>
        
        <div class="footer">
            <p class="footer-text">
                New users will be automatically registered
                <br>
                <span class="role-badge">GUEST ROLE</span>
            </p>
        </div>
    </div>
</body>
</html>
