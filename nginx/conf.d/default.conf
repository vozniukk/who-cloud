# Default server block - API Gateway proxy
server {
    listen 80;
    server_name localhost;

    # Connection limit
    limit_conn conn_limit 20;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Uncomment after SSL setup:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    error_page 429 /rate-limit.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    location = /rate-limit.html {
        root /usr/share/nginx/html;
    }

    # Frontend Service - Homepage and UI
    location / {
        # Rate limiting for public access
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;

        # Proxy to frontend-service (Next.js)
        proxy_pass http://frontend_service;
        
        # Preserve original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # HTTP version
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
    }

    # OAuth2 endpoints - direct proxy to auth-service
    location ~ ^/login/oauth2/ {
        # Rate limiting for OAuth (prevents brute force)
        limit_req zone=oauth_limit burst=50 nodelay;
        limit_req_status 429;

        # Proxy to auth service directly
        proxy_pass http://auth_service;
        
        # Preserve original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # HTTP version
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # OAuth2 callback endpoint
    location ~ ^/oauth2/ {
        # Rate limiting for OAuth callbacks
        limit_req zone=oauth_limit burst=50 nodelay;
        limit_req_status 429;

        # Proxy to auth service
        proxy_pass http://auth_service;
        
        # Preserve original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # HTTP version
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # API requests - proxy to API Gateway
    location /api/ {
        # Rate limiting (moderate - 100 req/s with burst of 200)
        limit_req zone=api_limit burst=200 nodelay;
        limit_req_status 429;

        # Proxy to API Gateway
        proxy_pass http://api_gateway;
        
        # Preserve original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # HTTP version and keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check endpoint (bypass rate limiting)
    location /actuator/health {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        access_log off;
    }

    # nginx status (internal only)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker network
        deny all;
    }
}
