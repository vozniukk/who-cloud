server:
  port: 8088

spring:
  application:
    name: admin-portal-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USER:whocloud}
    password: ${DB_PASSWORD:whocloud123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production}

logging:
  level:
    com.whocloud.admin: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
